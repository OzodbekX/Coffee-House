<section class="coffee-slider">
    <div class="container">
      <h2 class="heading-2">Choose your <span>favorite</span> coffee</h2>
  
      <div class="coffee-slider__swiper swiper">
        <div class="swiper-wrapper">
          <div class="swiper-slide coffee-card">
            <img src="assets/images/coffee-1.png" alt="Espresso" class="coffee-card__img" />
            <div class="coffee-card__info">
              <h3 class="heading-3">Espresso</h3>
              <p class="text-medium">Strong and rich taste for coffee lovers.</p>
              <span class="coffee-card__price">$4.50</span>
            </div>
          </div>
  
          <div class="swiper-slide coffee-card">
            <img src="assets/images/coffee-2.png" alt="Latte" class="coffee-card__img" />
            <div class="coffee-card__info">
              <h3 class="heading-3">Latte</h3>
              <p class="text-medium">Smooth blend with steamed milk.</p>
              <span class="coffee-card__price">$5.00</span>
            </div>
          </div>
  
          <div class="swiper-slide coffee-card">
            <img src="assets/images/coffee-3.png" alt="Cappuccino" class="coffee-card__img" />
            <div class="coffee-card__info">
              <h3 class="heading-3">Cappuccino</h3>
              <p class="text-medium">Perfect mix of foam and espresso.</p>
              <span class="coffee-card__price">$5.25</span>
            </div>
          </div>
        </div>
  
        <!-- Swiper Controls -->
        <div class="swiper-pagination"></div>
        <div class="swiper-button-prev"></div>
        <div class="swiper-button-next"></div>
      </div>
    </div>
  </section>
